name: Backend Secret History Indicator Audit
on:
  push:
    branches: [security/upstox-account-binding]
    paths:
      - "scripts/audit_git_secrets.py"
      - ".github/workflows/backend-secret-scan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan historical added text for credential indicators without logging values
        run: python3 scripts/audit_git_secrets.py
